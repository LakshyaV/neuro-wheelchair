# Every setting of neuro-wheelchair with its default value.
#
# Copy the parts you want to change into a file of your own and pass it with
#   nwc <command> -c my-settings.yaml
# or change single values on the command line:
#   nwc <command> -s engine.baseline_s=30
#
# frontend  how samples become analysis frames. A trained model is tied to these values.
# quality   when a frame, or an electrode, is not to be trusted (microvolts).
# protocol  the calibration recording: commands, runs, trials, timing.
# engine    driving: scheme, speeds, supervisor limits. Thresholds left empty (null) come from
#           the trained model, which carries the ones tuned for its wearer.
# sim       the simulator.
#
# This file is generated by tools/write_default_config.py.

frontend:
  fs: 256.0
  channels: [TP9, AF7, AF8, TP10]
  highpass_hz: 1.0
  window_s: 2.0
  hop_s: 0.25
  time_bandwidth: 3.0
  tapers: 5
  slow_hz: 15.0
  emg_band_hz: [30.0, 110.0]
  emg_window_s: 0.125
  emg_hop_s: 0.0625
  settle_s: 1.0
  max_filled: 0.1
quality:
  rms_min_uv: 0.7
  rms_max_uv: 60.0
  swing_max_uv: 150.0
  band_hz: [1.0, 45.0]
  lost_after_s: 3.0
  lost_share: 0.75
protocol:
  commands: [forward, left, right]
  baseline_s: 30.0
  runs: 3
  trials_per_command: 8
  cue_s: 5.0
  pause_s: [2.5, 3.5]
  clench_trials: 6
  clench_s: 1.5
  seed: 0
engine:
  scheme: auto
  baseline_s: 20.0
  command_interval_s: 0.1
  speeds:
    forward: [0.6, 0.6]
    backward: [-0.4, -0.4]
    left: [-0.35, 0.35]
    right: [0.35, -0.35]
  direct:
    bindings: {forward: forward, left: left, right: right, backward: backward}
  switch:
    options: [forward, left, right]
    scan_s: 2.0
    turn_s: 1.2
    max_run_s: 8.0
    settle_s: 1.5
    switch: clench
  supervisor: {stale_s: 1.0, recover_s: 2.0, max_motion_s: 10.0, rearm_hold_s: 2.0, require_link: true}
  arbiter: null
  clench: null
  quality: null
sim:
  fs: 256.0
  channels: [TP9, AF7, AF8, TP10]
  mains_hz: 60.0
  effect: 1.0
  trial_spread: 0.35
  onset_s: 0.5
  background_uv: [4.7, 3.0, 3.0, 4.7]
  sensor_uv: [5.4, 2.6, 4.2, 4.0]
  blink_rate_hz: 0.25
  blink_uv: 90.0
  clench_uv: [70.0, 18.0, 18.0, 70.0]
  twitch_rate_hz: 0.02
  shift_rate_hz: 0.01
  mains_uv: 3.0
  drift_db: 0.5
  session_spread_db: 1.5
  gain_spread: 0.15
  lifted_uv: 200.0
  lsb_uv: 0.48828125
