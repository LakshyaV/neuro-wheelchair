[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "neuro-wheelchair"
version = "0.2.0"
description = "EEG-driven wheelchair control with a Muse headband: calibrated intent decoding, a safety supervisor and a watchdog-protected motor controller."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lakshya Vasudeva" }]
keywords = ["EEG", "brain-computer interface", "Muse", "wheelchair", "assistive technology", "Arduino"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# EEG over OSC (Petal Metrics, Mind Monitor).
osc = ["python-osc>=1.8"]
# EEG over Lab Streaming Layer (muselsl, BlueMuse, Petal Metrics).
lsl = ["pylsl>=1.16.2"]
# USB serial link to the motor controller.
serial = ["pyserial>=3.5"]
# scikit-learn is only a reference to test the built-in classifier against.
dev = ["pytest>=8.0", "ruff==0.17.6", "scikit-learn>=1.4"]
all = ["neuro-wheelchair[osc,lsl,serial,dev]"]

[project.scripts]
nwc = "nwc.cli:main"

[project.urls]
Repository = "https://github.com/LakshyaV/neuro-wheelchair"
Issues = "https://github.com/LakshyaV/neuro-wheelchair/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nwc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: tests that open local UDP sockets",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "E741",   # l / I / O are conventional names in the maths-heavy modules
  "B905",   # zip() strictness is checked by shape asserts where it matters
  "SIM108", # ternaries are not always clearer
  "RUF001", # unicode symbols are intentional in user-facing strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
